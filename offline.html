<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#155e75">
  <meta name="robots" content="noindex,nofollow">
  <title>Sem conexão | Palmeirais Conectada</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; background: #071e29; color: #f5fffc; }
    main { width: min(100%, 440px); text-align: center; border: 1px solid #28535c; border-radius: 20px; padding: 32px 24px; background: #0c2b35; }
    svg { width: 68px; height: 68px; color: #54d1b2; }
    h1 { font-size: clamp(1.5rem,5vw,2rem); margin: 18px 0 12px; }
    p { line-height: 1.6; color: #d8ece9; }
    button { appearance: none; background: #12a680; color: #fff; border: 0; border-radius: 10px; min-height: 48px; padding: 12px 22px; font: inherit; font-weight: 700; cursor: pointer; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.2a10 10 0 0 1 14 0M8.7 15.7a5 5 0 0 1 6.6 0"/><path d="M12 20h.01M3 3l18 18"/></svg>
    <h1>Você está sem conexão</h1>
    <p>Para entrar, registrar denúncias e consultar atualizações, conecte-se à internet. Por segurança, o aplicativo não salva informações pessoais nem denúncias para acesso offline.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
