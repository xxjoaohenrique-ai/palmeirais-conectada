<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Palmeirais Conectada</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <i class="fas fa-city"></i>
                <span>Palmeirais Conectada</span>
            </a>
            
            <button class="nav-toggle" id="navToggle">
                <i class="fas fa-bars"></i>
            </button>
            
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link"><i class="fas fa-home"></i> Início</a></li>
                <li><a href="sobre.html" class="nav-link"><i class="fas fa-info-circle"></i> Sobre</a></li>
                <li><a href="login.html" class="nav-link active btn-nav"><i class="fas fa-sign-in-alt"></i> Entrar</a></li>
            </ul>
            
            <button class="theme-toggle" id="themeToggle" title="Alternar tema">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </nav>

    <!-- Formulário de Login -->
    <section class="form-container">
        <div class="form-card">
            <div class="form-header">
                <i class="fas fa-user-circle"></i>
                <h1>Entrar</h1>
                <p>Acesse sua conta para fazer denúncias</p>
            </div>
            
            <div id="loginError" style="display: none;"></div>
            
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> E-mail
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-control" 
                        placeholder="seu@email.com"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label for="senha">
                        <i class="fas fa-lock"></i> Senha
                    </label>
                    <div style="position: relative;">
                        <input 
                            type="password" 
                            id="senha" 
                            class="form-control" 
                            placeholder="Sua senha"
                            required
                        >
                        <button 
                            type="button" 
                            onclick="togglePasswordVisibility('senha', this)"
                            style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted);"
                        >
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block btn-lg">
                    <i class="fas fa-sign-in-alt"></i> Entrar
                </button>
            </form>
            
            <div class="form-footer">
                <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
            </div>
            

        </div>
    </section>

    <!-- Footer -->
    <footer class="footer" style="position: fixed; bottom: 0; left: 0; right: 0; padding: 1rem 0;">
        <div class="container">
            <div class="footer-bottom" style="border: none; padding: 0;">
                    <p>&copy; 2026 Palmeirais Conectada - Prefeitura Municipal de Palmeirais. Todos os direitos reservados.</p>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Verificar se já está logado
        document.addEventListener('DOMContentLoaded', function() {
            const currentUser = getCurrentUser();
            if (currentUser) {
                window.location.href = currentUser.isAdmin ? 'admin.html' : 'index.html';
            }
        });
    </script>
</body>
</html>
