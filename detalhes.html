<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da Denúncia - Palmeirais Conectada</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <i class="fas fa-city"></i>
                <span>Palmeirais Conectada</span>
            </a>
            
            <button class="nav-toggle" id="navToggle">
                <i class="fas fa-bars"></i>
            </button>
            
            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link"><i class="fas fa-home"></i> Início</a></li>
                <li><a href="sobre.html" class="nav-link"><i class="fas fa-info-circle"></i> Sobre</a></li>
                <li id="navDenuncia" style="display: none;"><a href="denuncia.html" class="nav-link"><i class="fas fa-plus-circle"></i> Nova Denúncia</a></li>
                <li id="navMinhasDenuncias" style="display: none;"><a href="minhas-denuncias.html" class="nav-link"><i class="fas fa-list"></i> Minhas Denúncias</a></li>
                <li id="navAdmin" style="display: none;"><a href="admin.html" class="nav-link"><i class="fas fa-cog"></i> Painel Admin</a></li>
                <li id="navLogin"><a href="login.html" class="nav-link btn-nav"><i class="fas fa-sign-in-alt"></i> Entrar</a></li>
                <li id="navLogout" style="display: none;"><a href="#" class="nav-link btn-nav-outline" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Sair</a></li>
            </ul>
            
            <button class="theme-toggle" id="themeToggle" title="Alternar tema">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </nav>

    <!-- Página de Detalhes -->
    <section class="details-page">
        <div class="details-container" id="detailsContainer">
            <!-- Carregado via JavaScript -->
            <div class="loading-overlay" style="position: relative; min-height: 400px; background: var(--bg-card); border-radius: var(--radius-xl);">
                <div class="spinner"></div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Palmeirais Conectada - Prefeitura Municipal de Palmeirais. Todos os direitos reservados.</p>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Atualizar navbar
            updateUIForLoggedUser();
            
            // Carregar detalhes
            loadDenunciaDetails();
        });
        
        function loadDenunciaDetails() {
            const container = document.getElementById('detailsContainer');
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            
            if (!id) {
                container.innerHTML = `
                    <div class="details-card" style="padding: 4rem; text-align: center;">
                        <i class="fas fa-exclamation-circle" style="font-size: 4rem; color: var(--danger); margin-bottom: 1rem;"></i>
                        <h2>Denúncia não encontrada</h2>
                        <p style="color: var(--text-secondary); margin-bottom: 2rem;">O ID da denúncia não foi especificado.</p>
                        <a href="index.html" class="btn btn-primary">
                            <i class="fas fa-home"></i> Voltar ao Início
                        </a>
                    </div>
                `;
                return;
            }
            
            const denuncias = getDenuncias();
            const denuncia = denuncias.find(d => d.id === id);
            
            if (!denuncia) {
                container.innerHTML = `
                    <div class="details-card" style="padding: 4rem; text-align: center;">
                        <i class="fas fa-search" style="font-size: 4rem; color: var(--warning); margin-bottom: 1rem;"></i>
                        <h2>Denúncia não encontrada</h2>
                        <p style="color: var(--text-secondary); margin-bottom: 2rem;">A denúncia que você procura não existe ou foi removida.</p>
                        <a href="index.html" class="btn btn-primary">
                            <i class="fas fa-home"></i> Voltar ao Início
                        </a>
                    </div>
                `;
                return;
            }
            
            const currentUser = getCurrentUser();
            const isOwner = currentUser && currentUser.id === denuncia.userId;
            const isAdmin = currentUser && currentUser.isAdmin;
            
            container.innerHTML = `
                <div class="details-card">
                    <div class="details-image">
                        <img src="${denuncia.foto}" alt="${denuncia.titulo}">
                        <div class="details-status">
                            <span class="status-badge ${denuncia.status}">
                                <i class="${getStatusIcon(denuncia.status)}"></i>
                                ${capitalizeFirst(denuncia.status.replace('-', ' '))}
                            </span>
                        </div>
                    </div>
                    
                    <div class="details-content">
                        <div class="details-header">
                            <span class="details-category">
                                <i class="${getCategoryIcon(denuncia.categoria)}"></i>
                                ${denuncia.categoria}
                            </span>
                            <span style="color: var(--text-muted); font-size: 0.875rem;">
                                #${denuncia.id.substring(0, 8)}
                            </span>
                        </div>
                        
                        <h1 class="details-title">${denuncia.titulo}</h1>
                        
                        <div class="details-info">
                            <div class="details-info-item">
                                <i class="fas fa-map-marker-alt"></i>
                                <div>
                                    <span>Localização</span>
                                    <strong>${denuncia.endereco}</strong>
                                </div>
                            </div>
                            <div class="details-info-item">
                                <i class="fas fa-calendar-alt"></i>
                                <div>
                                    <span>Data do Registro</span>
                                    <strong>${formatDateTime(denuncia.data)}</strong>
                                </div>
                            </div>
                            <div class="details-info-item">
                                <i class="fas fa-user"></i>
                                <div>
                                    <span>Denunciante</span>
                                    <strong>${denuncia.userName}</strong>
                                </div>
                            </div>
                            <div class="details-info-item">
                                <i class="fas fa-sync-alt"></i>
                                <div>
                                    <span>Última Atualização</span>
                                    <strong>${formatDateTime(denuncia.dataAtualizacao)}</strong>
                                </div>
                            </div>
                        </div>
                        
                        <div class="details-description">
                            <h3><i class="fas fa-align-left"></i> Descrição</h3>
                            <p>${denuncia.descricao}</p>
                        </div>
                        
                        <div class="details-actions">
                            <a href="javascript:history.back()" class="btn btn-outline">
                                <i class="fas fa-arrow-left"></i> Voltar
                            </a>
                            ${isOwner || isAdmin ? `
                                ${isAdmin ? `
                                    <a href="admin.html" class="btn btn-primary">
                                        <i class="fas fa-cog"></i> Painel Admin
                                    </a>
                                ` : ''}
                            ` : ''}
                        </div>
                        
                        <!-- Timeline de Status -->
                        <div style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--gray-200);">
                            <h3 style="font-size: 1.125rem; color: var(--text-primary); margin-bottom: 1.5rem;">
                                <i class="fas fa-history" style="color: var(--primary); margin-right: 0.5rem;"></i>
                                Histórico de Status
                            </h3>
                            <div style="display: flex; flex-direction: column; gap: 1rem;">
                                <div style="display: flex; align-items: center; gap: 1rem;">
                                    <div style="width: 12px; height: 12px; background: var(--warning); border-radius: 50%;"></div>
                                    <div style="flex: 1;">
                                        <strong style="color: var(--text-primary);">Denúncia Registrada</strong>
                                        <p style="color: var(--text-muted); font-size: 0.875rem; margin-top: 0.25rem;">
                                            ${formatDateTime(denuncia.data)}
                                        </p>
                                    </div>
                                </div>
                                ${denuncia.status === 'em-analise' || denuncia.status === 'resolvido' ? `
                                    <div style="display: flex; align-items: center; gap: 1rem;">
                                        <div style="width: 12px; height: 12px; background: var(--info); border-radius: 50%;"></div>
                                        <div style="flex: 1;">
                                            <strong style="color: var(--text-primary);">Em Análise</strong>
                                            <p style="color: var(--text-muted); font-size: 0.875rem; margin-top: 0.25rem;">
                                                A equipe está analisando a denúncia
                                            </p>
                                        </div>
                                    </div>
                                ` : ''}
                                ${denuncia.status === 'resolvido' ? `
                                    <div style="display: flex; align-items: center; gap: 1rem;">
                                        <div style="width: 12px; height: 12px; background: var(--success); border-radius: 50%;"></div>
                                        <div style="flex: 1;">
                                            <strong style="color: var(--text-primary);">Resolvido</strong>
                                            <p style="color: var(--text-muted); font-size: 0.875rem; margin-top: 0.25rem;">
                                                ${formatDateTime(denuncia.dataAtualizacao)}
                                            </p>
                                        </div>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
