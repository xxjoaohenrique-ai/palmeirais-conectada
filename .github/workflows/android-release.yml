name: Build signed Play Store AAB (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require private signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          STOREPASS: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          KEYPASS: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
          KEYALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::Missing PLAY_UPLOAD_KEYSTORE_BASE64"; exit 1; }
          test -n "$STOREPASS" || { echo "::error::Missing PLAY_UPLOAD_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEYPASS" || { echo "::error::Missing PLAY_UPLOAD_KEY_PASSWORD"; exit 1; }
          test -n "$KEYALIAS" || { echo "::error::Missing PLAY_UPLOAD_KEY_ALIAS"; exit 1; }

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Android API 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Configure Bubblewrap
        run: |
          npm install -g @bubblewrap/cli@1.22.0
          mkdir -p "$HOME/.bubblewrap"
          node -e 'require("fs").writeFileSync(process.env.HOME+"/.bubblewrap/config.json",JSON.stringify({jdkPath:process.env.JAVA_HOME,androidSdkPath:process.env.ANDROID_HOME}))'

      - name: Generate release project
        working-directory: android
        run: |
          bubblewrap update --skipVersionUpgrade
          grep -Eq 'targetSdkVersion[[:space:]]+36' app/build.gradle

      - name: Restore signing key to temporary directory
        env:
          KEYSTORE_B64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/palmeirais-release.jks"
          test -s "$RUNNER_TEMP/palmeirais-release.jks"
          chmod 600 "$RUNNER_TEMP/palmeirais-release.jks"

      - name: Build signed Android APK and AAB
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
          KEYALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
        run: |
          bubblewrap build --signingKeyPath "$RUNNER_TEMP/palmeirais-release.jks" --signingKeyAlias "$KEYALIAS"
          test -s app-release-bundle.aab
          test -s app-release-signed.apk

      - name: Upload signed Play Store AAB and test APK
        uses: actions/upload-artifact@v4
        with:
          name: palmeirais-conectada-PLAY-ASSINADO
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk
          if-no-files-found: error
          retention-days: 7
