name: Build Android test APK (TWA)

on:
  pull_request:
    paths:
      - 'android/**'
      - 'manifest.webmanifest'
      - 'icons/**'
      - '.github/workflows/android-test.yml'
  push:
    branches:
      - feat/play-store-safari-app
    paths:
      - 'android/**'
      - 'manifest.webmanifest'
      - 'icons/**'
      - '.github/workflows/android-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Android API 36 using runner SDK
        run: |
          test -n "$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0' 'build-tools;34.0.0'
          # Bubblewrap 1.22 expects an SDK-root bin/ directory.
          if [ ! -e "$ANDROID_HOME/bin" ]; then sudo ln -s "$(dirname "$SDKMANAGER")" "$ANDROID_HOME/bin"; fi

      - name: Install Bubblewrap and noninteractive configuration
        run: |
          npm install -g @bubblewrap/cli@1.22.0
          mkdir -p "$HOME/.bubblewrap"
          node -e 'require("fs").writeFileSync(process.env.HOME+"/.bubblewrap/config.json",JSON.stringify({jdkPath:process.env.JAVA_HOME,androidSdkPath:process.env.ANDROID_HOME}))'

      - name: Generate TWA Android project
        working-directory: android
        run: bubblewrap update --skipVersionUpgrade

      - name: Enforce Play target API
        working-directory: android
        run: |
          grep -Eq 'targetSdkVersion[[:space:]]+36' app/build.gradle
          grep -Eq 'compileSdkVersion[[:space:]]+36' app/build.gradle

      - name: Create temporary TEST signing key
        shell: bash
        run: |
          TEST_STOREPASS="$(openssl rand -hex 24)"
          echo "::add-mask::$TEST_STOREPASS"
          echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$TEST_STOREPASS" >> "$GITHUB_ENV"
          echo "BUBBLEWRAP_KEY_PASSWORD=$TEST_STOREPASS" >> "$GITHUB_ENV"
          keytool -genkeypair -noprompt -v -keystore "$RUNNER_TEMP/palmeirais-test.jks" \
            -alias palmeirais -keyalg RSA -keysize 3072 -validity 365 \
            -storepass "$TEST_STOREPASS" -keypass "$TEST_STOREPASS" \
            -dname 'CN=Palmeirais Test, O=Test Build, C=BR'

      - name: Build test Android APK
        working-directory: android
        run: |
          bubblewrap build --signingKeyPath "$RUNNER_TEMP/palmeirais-test.jks" --signingKeyAlias palmeirais
          test -s app-release-signed.apk

      - name: Upload APK for device testing only
        uses: actions/upload-artifact@v4
        with:
          name: palmeirais-conectada-android-TESTE
          path: android/app-release-signed.apk
          if-no-files-found: error
          retention-days: 7
